name: CI
on: [push]
jobs:
  tests:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 1
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip3 install -U pip
          pip3 install -r requirements.txt
      - run: |
          source .venv/bin/activate
          pytest
